[project]
name = "attmap"
version = "0.14.0"
description = "Multiple access patterns for key-value reference"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.8"
authors = [
    { name = "Nathan Sheffield" },
    { name = "Vince Reuter" },
    { name = "Michal Stolarczyk" },
]
keywords = [
    "dict",
    "map",
    "mapping",
    "dot",
    "item",
    "getitem",
    "attr",
    "getattr",
    "key-value",
    "dynamic",
    "mutable",
    "access",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ubiquerg>=0.2.1",
]

[project.urls]
Homepage = "https://github.com/pepkit/attmap"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = [
    "hypothesis",
    "numpy",
    "pandas",
    "pytest",
    "pyyaml",
    "veracitools",
]

[tool.pytest.ini_options]
addopts = "-rfE"
testpaths = ["tests"]
python_classes = ["Test*", "*Test", "*Tests", "*Tester"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403", "F405", "E501", "E721", "E731", "E741", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["attmap"]
